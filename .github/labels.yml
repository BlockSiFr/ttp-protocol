# Trust Transfer Protocol — canonical label system.
# Synced to the repo by .github/workflows/labels.yml (EndBug/label-sync).
# Colors follow the TTP brand token palette.

- name: "type: protocol"
  color: "00D4FF"
  description: "Protocol grammar, semantics, or schema"
- name: "type: runtime"
  color: "0066CC"
  description: "Runtime authority gate and enforcement"
- name: "type: docs"
  color: "8892A0"
  description: "Documentation and concepts"
- name: "type: examples"
  color: "00B8A9"
  description: "Example .ttp files and integrations"
- name: "type: security"
