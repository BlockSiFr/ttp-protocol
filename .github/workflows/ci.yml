name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: CLI, Examples, and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Documentation smoke check
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/getting-started.md
          test -f docs/integration-guide.md
          test -f docs/open-source-boundary.md
          test -f docs/ops/persistent-storage.md

      - name: Compile Python SDK
        run: python -m py_compile sdk/python/client.py sdk/python/agt.py sdk/python/aggregate.py

      - name: Test Python SDK
        run: python -m unittest discover -s sdk/python -p 'test_*.py' -v

      - name: Check PCTR/AGT cross-language parity
        run: node scripts/check-agt-parity.mjs

      - name: Build TypeScript SDK
        run: npm run build:sdk

      - name: Build Trust Authority reference
        run: npm run build:trust-authority

      - name: Show CLI version
        run: npm run ttp -- version

      - name: Check TTP examples
        run: npm run check:examples

      - name: Run local adoption demo
        run: npm run demo

      - name: Run tests
        run: npm test
