<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="ttp check CLI output">
  <defs>
    <style>/*@FONTS@*//*@FONTS_BEGIN@*/@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}/*@FONTS_END@*/
      .m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px}
      .t{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1px;fill:#8892A0}
    </style>
  </defs>
  <rect width="900" height="380" fill="#0A0A0F"/>
  <rect x="16" y="16" width="868" height="348" rx="12" fill="#0B0D13" stroke="#1E2430"/>
  <!-- title bar -->
  <path d="M16 28 a12 12 0 0 1 12 -12 h844 a12 12 0 0 1 12 12 v22 h-868 z" fill="#101521"/>
  <line x1="16" y1="50" x2="884" y2="50" stroke="#1E2430"/>
  <circle cx="40" cy="33" r="5" fill="#FF3D00"/>
  <circle cx="58" cy="33" r="5" fill="#FFB300"/>
  <circle cx="76" cy="33" r="5" fill="#00E676"/>
  <text class="t" x="450" y="37" text-anchor="middle">ttp — trust check</text>

  <!-- prompt -->
  <text class="m" x="40" y="92"><tspan fill="#00D4FF">$</tspan><tspan fill="#C2CAD6" dx="8">ttp check examples/01-basic-agent.ttp</tspan></text>

  <!-- json -->
  <g class="m">
    <text x="40"  y="124" fill="#8892A0">{</text>
    <text x="64"  y="148"><tspan fill="#00D4FF">"ok"</tspan><tspan fill="#8892A0">: </tspan><tspan fill="#00E676">true</tspan><tspan fill="#8892A0">,</tspan></text>
    <text x="64"  y="172"><tspan fill="#00D4FF">"file"</tspan><tspan fill="#8892A0">: </tspan><tspan fill="#00B8A9">"examples/01-basic-agent.ttp"</tspan><tspan fill="#8892A0">,</tspan></text>
    <text x="64"  y="196"><tspan fill="#00D4FF">"subjects"</tspan><tspan fill="#8892A0">: </tspan><tspan fill="#FFB300">1</tspan><tspan fill="#8892A0">,</tspan></text>
    <text x="64"  y="220"><tspan fill="#00D4FF">"trust_claims"</tspan><tspan fill="#8892A0">: </tspan><tspan fill="#FFB300">1</tspan><tspan fill="#8892A0">,</tspan></text>
    <text x="64"  y="244"><tspan fill="#00D4FF">"proofs"</tspan><tspan fill="#8892A0">: </tspan><tspan fill="#FFB300">1</tspan><tspan fill="#8892A0">,</tspan></text>
    <text x="64"  y="268"><tspan fill="#00D4FF">"authority_contexts"</tspan><tspan fill="#8892A0">: </tspan><tspan fill="#FFB300">1</tspan><tspan fill="#8892A0">,</tspan></text>
    <text x="64"  y="292"><tspan fill="#00D4FF">"delegations"</tspan><tspan fill="#8892A0">: </tspan><tspan fill="#FFB300">0</tspan></text>
    <text x="40"  y="316" fill="#8892A0">}</text>
  </g>
  <!-- status line -->
  <path d="M40 344 l5 5 l9 -10" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="62" y="348" fill="#00E676">VALID · 1 subject · 1 proof</text>
</svg>
